# pacman.conf used ONLY while building the ISO (by mkarchiso).
# It is not copied to the live system.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# aedwen-local: packages that are no longer in the official repos and must be
# built from the AUR before the ISO build. Currently: calamares, ckbcomp.
# Populate it with:  ./scripts/build-localrepo.sh
# Listed first so it is preferred over any repo copy. Unsigned (makepkg output),
# hence SigLevel = Optional TrustAll.
[aedwen-local]
SigLevel = Optional TrustAll
Server = file:///run/media/section/Workload/Storage/OS/AedwenOS/iso/localrepo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# chaotic-aur: provides the prebuilt `paru` package (and would provide
# linux-xanmod if re-added as a selectable kernel). Everything else comes from
# the official repos. Before building, the chaotic-aur keyring + mirrorlist must
# be present on the build host:
#
#   pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
#   pacman-key --lsign-key 3056513887B78AEB
#   pacman -U 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
#             'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
#
# To avoid the third-party repo entirely, drop `paru` from packages.x86_64 and
# build it from the AUR inside the installer instead.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
