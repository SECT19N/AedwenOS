SERIAL 0 115200
UI vesamenu.c32
MENU TITLE AedwenOS
DEFAULT aedwen
TIMEOUT 30
PROMPT 0

LABEL aedwen
    MENU LABEL AedwenOS (x86_64, linux-zen)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL aedwencow
    MENU LABEL AedwenOS (x86_64) with persistent overlay
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=2G
