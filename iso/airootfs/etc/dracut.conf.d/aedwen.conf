# AedwenOS dracut defaults for the installed system.
#
# This file has no effect on the live ISO: the live medium's initramfs is built
# by mkinitcpio (archiso requires it). dracut only runs on the installed system,
# driven by /etc/pacman.d/hooks/*dracut*.

# zstd-compressed initramfs (matches the kernel's own zstd support).
compress="zstd"

# Build a portable (non-host-only) initramfs. Slightly larger, but it survives
# hardware changes and matches the "clone the live system" install model.
hostonly="no"

# Root is Btrfs with a subvolume layout; make sure the module is always present.
add_dracutmodules+=" btrfs "

# Branded boot splash. The "aedwen" theme + /etc/plymouth/plymouthd.conf are
# shipped in the live filesystem, so dracut picks them up automatically.
# Needs "quiet splash" on the kernel cmdline (set in the Limine entry).
add_dracutmodules+=" plymouth "
