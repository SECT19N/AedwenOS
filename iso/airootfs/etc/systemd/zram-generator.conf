# Compressed RAM swap for day-to-day overflow. Higher swap-priority than the
# real disk swap partition (Calamares' "suspend" choice, default ~-2), so
# zram absorbs routine swapping and the disk partition stays idle except for
# actual hibernate/resume. See iso/airootfs/etc/calamares/modules/partition.conf
# and shellprocess-postinstall.conf (resume= kernel cmdline).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
