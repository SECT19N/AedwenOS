# AedwenOS Calamares configuration.
# Status: SCAFFOLD -- structurally complete, needs a test/tune pass in a VM.
# The reliable installer today is `aedwen-install` (shell). See repo README.
#
# Model A: the installed system is a clone of the live filesystem (unpackfs).
# The `packages` module then removes the "LIVE ONLY" packages listed in
# iso/packages.x86_64 (mkinitcpio among them), and `shellprocess@postinstall`
# sets up the dracut initramfs hooks, generates the initramfs, then finishes
# Limine + paru.

modules-search: [ local ]

instances:
- id:     postinstall
  module: shellprocess
  config: shellprocess-postinstall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - packages
  - shellprocess@postinstall
  - umount
- show:
  - finished

branding: aedwenos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
