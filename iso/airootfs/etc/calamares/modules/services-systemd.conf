units:
  - name: NetworkManager.service
    action: enable
  - name: sddm.service
    action: enable
  - name: systemd-timesyncd.service
    action: enable
  - name: firewalld.service
    action: enable
  - name: snapper-timeline.timer
    action: enable
  - name: snapper-cleanup.timer
    action: enable
  # bluez/cups are installed but ship disabled -- without these the
  # Bluetooth applet and print-manager have no daemon to talk to
  - name: bluetooth.service
    action: enable
  - name: cups.socket
    action: enable
  # weekly TRIM for SSDs (no-op on disks without discard support)
  - name: fstrim.timer
    action: enable
