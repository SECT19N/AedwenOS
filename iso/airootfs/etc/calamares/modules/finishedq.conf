# Load the page from the AedwenOS branding folder first
# (branding/aedwenos/finishedq.qml), falling back to the built-in page.
qmlSearch: both

# Calamares 3.4 keys (restartNowEnabled/Checked are deprecated): the page
# offers "Restart now", unticked by default.
restartNowMode: user-unchecked
restartNowCommand: "systemctl reboot"
