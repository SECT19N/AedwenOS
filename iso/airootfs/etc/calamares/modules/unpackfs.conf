# Copy the live filesystem onto the target.
# archiso mounts the read-only squashfs image at /run/archiso/airootfs (also
# with copytoram) -- it is a directory, not the .sfs file, so it is copied as
# sourcefs "file" (plain rsync). "squashfs" would make Calamares run
# `unsquashfs -l` on the directory, which fails and crashes the module.
# This is the pristine image, not the live overlay: nothing the live session
# changed at runtime (live user, passwords, ...) is copied.
unpack:
  - source: "/run/archiso/airootfs"
    sourcefs: "file"
    destination: ""
