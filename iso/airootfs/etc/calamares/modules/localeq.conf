# Load the page from the AedwenOS branding folder first
# (branding/aedwenos/localeq.qml), falling back to the built-in page.
qmlSearch: both

# Starting time zone when GeoIP can't tell; GeoIP (needs network) picks
# the user's real zone and the page lets them change it.
region: "America"
zone: "New_York"
geoip:
    style: "json"
    url: "https://geoip.kde.org/v1/calamares"
    selector: ""
