# Load the page from the AedwenOS branding folder first
# (branding/aedwenos/welcomeq.qml), falling back to the built-in page.
qmlSearch: both

showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
requirements:
  requiredStorage:    8
  requiredRam:        2.0
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - root
