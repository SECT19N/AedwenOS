# Calamares 3.4 mount module. btrfsSubvolumes and mountOptions both live here
# (not in partition.conf / fstab.conf as in older Calamares): the fstab module
# reads the options back from global storage, so this is also what ends up in
# the installed /etc/fstab.
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  # efibootmgr in shellprocess-postinstall needs efivars inside the chroot
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# Same layout as aedwen-install. Root must stay /@ -- the Limine cmdline uses
# rootflags=subvol=@. /.snapshots is its own subvolume, so snapper's config is
# shipped directly instead of via `snapper create-config`.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /var/cache/pacman/pkg
    subvolume: /@pkg
  - mountPoint: /.snapshots
    subvolume: /@snapshots

mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1, space_cache=v2 ]
    ssdOptions: [ ssd, discard=async ]
