# Remove the packages that only exist to run the live medium / installer.
# Keep this list in sync with the "LIVE ONLY" entries in iso/packages.x86_64.
backend: pacman

operations:
  - try_remove:
      - calamares
      - ckbcomp
      - squashfs-tools
      - mkinitcpio-archiso
      - mkinitcpio
      - syslinux
      - edk2-shell
      - arch-install-scripts
      - gptfdisk
      - parted

pacman:
  num_retries: 3
  disable_download_timeout: true
