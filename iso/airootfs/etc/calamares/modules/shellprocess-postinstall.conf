# Post-install steps that Calamares has no native module for:
#   - dracut initramfs hooks + first generation (mkinitcpio was pruned by the
#     `packages` module; the installed system uses dracut)
#   - Limine bootloader (Calamares' bootloader module only does grub/systemd-boot)
#   - a pacman hook so Limine redeploys itself on future upgrades
#   - the chaotic-aur repository (prebuilt AUR packages; paru is already cloned in)
# Runs inside the target chroot.
dontChroot: false
timeout: 600
script:
  # --- dracut initramfs ---
  - |
    install -Dm644 /dev/stdin /etc/pacman.d/hooks/90-dracut-install.hook <<EOF
    [Trigger]
    Type = Path
    Operation = Install
    Operation = Upgrade
    Target = usr/lib/modules/*/pkgbase

    [Action]
    Description = Regenerating dracut initramfs...
    When = PostTransaction
    Exec = /usr/local/bin/aedwen-dracut.sh install
    NeedsTargets
    EOF
  - |
    install -Dm644 /dev/stdin /etc/pacman.d/hooks/60-dracut-remove.hook <<EOF
    [Trigger]
    Type = Path
    Operation = Remove
    Target = usr/lib/modules/*/pkgbase

    [Action]
    Description = Removing dracut initramfs...
    When = PreTransaction
    Exec = /usr/local/bin/aedwen-dracut.sh remove
    NeedsTargets
    EOF
  - "/usr/local/bin/aedwen-dracut.sh all"
  # --- bootloader ---
  - "pacman -S --noconfirm --needed limine efibootmgr"
  - "install -Dm644 /usr/share/limine/BOOTX64.EFI /boot/EFI/BOOT/BOOTX64.EFI"
  - |
    ROOT_UUID=$(findmnt -no UUID /)
    cat > /boot/limine.conf <<EOF
    timeout: 3

    /AedwenOS (linux-zen)
        protocol: linux
        kernel_path: boot():/vmlinuz-linux-zen
        module_path: boot():/initramfs-linux-zen.img
        cmdline: root=UUID=$ROOT_UUID rw rootfstype=btrfs rootflags=subvol=@
    EOF
  - |
    install -Dm644 /dev/stdin /etc/pacman.d/hooks/95-limine-deploy.hook <<EOF
    [Trigger]
    Operation = Install
    Operation = Upgrade
    Type = Package
    Target = limine

    [Action]
    Description = Deploying Limine to the EFI system partition...
    When = PostTransaction
    Exec = /usr/bin/install -Dm644 /usr/share/limine/BOOTX64.EFI /boot/EFI/BOOT/BOOTX64.EFI
    EOF
  - |
    DISK=/dev/$(lsblk -no PKNAME "$(findmnt -no SOURCE /boot)" | head -1)
    efibootmgr --create --disk "$DISK" --part 1 \
      --label AedwenOS --loader '\EFI\BOOT\BOOTX64.EFI' --unicode || true
  - "pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com"
  - "pacman-key --lsign-key 3056513887B78AEB"
  - "pacman -U --noconfirm https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst"
  - |
    grep -q '\[chaotic-aur\]' /etc/pacman.conf || \
      printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' >> /etc/pacman.conf
