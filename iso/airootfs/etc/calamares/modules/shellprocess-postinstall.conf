# Post-install steps that Calamares has no native module for:
#   - dracut initramfs hooks + first generation (mkinitcpio was pruned by the
#     `packages` module; the installed system uses dracut)
#   - Limine bootloader (Calamares' bootloader module only does grub/systemd-boot)
#   - a pacman hook so Limine redeploys itself on future upgrades
#
# NOTE on the pacman keyring: Calamares' `unpackfs` module clones the live
# medium's filesystem verbatim, including /etc/pacman.d/gnupg -- which the ISO
# build pre-populated (airootfs/root/customize_airootfs.sh) so `pacman -S`
# works on the live medium. That directory holds a *per-machine* random master
# key, so leaving the clone in place would give every installation the same
# master key as the ISO. Wipe it and regenerate on the target, then re-import
# the static distro keys from the archlinux-keyring / chaotic-keyring packages
# (already on disk, no network needed). Same step aedwen-install runs.
# /etc/pacman.conf ([chaotic-aur] included) and /etc/pacman.d/chaotic-mirrorlist
# come across from the clone unchanged and need no further action.
# Runs inside the target chroot.
dontChroot: false
timeout: 600
script:
  # --- pacman keyring: fresh per-machine master key ---
  - "rm -rf /etc/pacman.d/gnupg"
  - "pacman-key --init"
  # keyring name = file stem under /usr/share/pacman/keyrings/ ("chaotic.gpg")
  - "pacman-key --populate archlinux chaotic"
  # --- dracut initramfs ---
  - |
    install -Dm644 /dev/stdin /etc/pacman.d/hooks/90-dracut-install.hook <<EOF
    [Trigger]
    Type = Path
    Operation = Install
    Operation = Upgrade
    Target = usr/lib/modules/*/pkgbase

    [Action]
    Description = Regenerating dracut initramfs...
    When = PostTransaction
    Exec = /usr/local/bin/aedwen-dracut.sh install
    NeedsTargets
    EOF
  - |
    install -Dm644 /dev/stdin /etc/pacman.d/hooks/60-dracut-remove.hook <<EOF
    [Trigger]
    Type = Path
    Operation = Remove
    Target = usr/lib/modules/*/pkgbase

    [Action]
    Description = Removing dracut initramfs...
    When = PreTransaction
    Exec = /usr/local/bin/aedwen-dracut.sh remove
    NeedsTargets
    EOF
  - "/usr/local/bin/aedwen-dracut.sh all"
  # --- bootloader ---
  - "pacman -S --noconfirm --needed limine efibootmgr"
  - "install -Dm644 /usr/share/limine/BOOTX64.EFI /boot/EFI/BOOT/BOOTX64.EFI"
  - |
    ROOT_UUID=$(findmnt -no UUID /)
    cat > /boot/limine.conf <<EOF
    timeout: 3

    /AedwenOS (linux-zen)
        protocol: linux
        kernel_path: boot():/vmlinuz-linux-zen
        module_path: boot():/initramfs-linux-zen.img
        cmdline: root=UUID=$ROOT_UUID rw rootfstype=btrfs rootflags=subvol=@ quiet splash
    EOF
  - |
    install -Dm644 /dev/stdin /etc/pacman.d/hooks/95-limine-deploy.hook <<EOF
    [Trigger]
    Operation = Install
    Operation = Upgrade
    Type = Package
    Target = limine

    [Action]
    Description = Deploying Limine to the EFI system partition...
    When = PostTransaction
    Exec = /usr/bin/install -Dm644 /usr/share/limine/BOOTX64.EFI /boot/EFI/BOOT/BOOTX64.EFI
    EOF
  - |
    DISK=/dev/$(lsblk -no PKNAME "$(findmnt -no SOURCE /boot)" | head -1)
    efibootmgr --create --disk "$DISK" --part 1 \
      --label AedwenOS --loader '\EFI\BOOT\BOOTX64.EFI' --unicode || true
  # --- snapper ---
  # @snapshots / .snapshots already exists as its own subvolume (see
  # partition.conf), so `snapper create-config` would conflict with it --
  # ship the config directly instead. Based on snapper's own upstream
  # default-config, with TIMELINE_LIMIT_WEEKLY raised from 0 so timeline
  # cleanup keeps some weekly snapshots too, on top of hourly/daily/monthly.
  - |
    install -Dm644 /dev/stdin /etc/snapper/configs/root <<'SNAPCFG'
    SUBVOLUME="/"
    FSTYPE="btrfs"
    QGROUP=""
    SPACE_LIMIT="0.5"
    FREE_LIMIT="0.2"
    UNIQUE_NUMBERS="yes"
    ALLOW_USERS=""
    ALLOW_GROUPS=""
    SYNC_ACL="no"
    BACKGROUND_COMPARISON="yes"
    NUMBER_CLEANUP="yes"
    NUMBER_MIN_AGE="3600"
    NUMBER_LIMIT="50"
    NUMBER_LIMIT_IMPORTANT="10"
    TIMELINE_CREATE="yes"
    TIMELINE_CLEANUP="yes"
    TIMELINE_MIN_AGE="3600"
    TIMELINE_LIMIT_HOURLY="10"
    TIMELINE_LIMIT_DAILY="10"
    TIMELINE_LIMIT_WEEKLY="4"
    TIMELINE_LIMIT_MONTHLY="10"
    TIMELINE_LIMIT_QUARTERLY="0"
    TIMELINE_LIMIT_YEARLY="10"
    EMPTY_PRE_POST_CLEANUP="yes"
    EMPTY_PRE_POST_MIN_AGE="3600"
    SNAPCFG
    install -Dm644 /dev/stdin /etc/conf.d/snapper <<'SNAPPERCONF'
    SNAPPER_CONFIGS="root"
    SNAPPERCONF
    chmod 750 /.snapshots
  # limine-snapper-sync auto-detects the entry name from /etc/os-release
  # PRETTY_NAME ("AedwenOS"), but the entry above is "AedwenOS (linux-zen)" --
  # pin it explicitly so entry targeting doesn't depend on that fuzzy match.
  - "sed -i 's/^#TARGET_OS_NAME=.*/TARGET_OS_NAME=\"AedwenOS (linux-zen)\"/' /etc/limine-snapper-sync.conf"
  # --- firewalld ---
  # No daemon is running inside this chroot, so use the offline editor rather
  # than firewall-cmd. This only opens the port; sshd itself is not enabled.
  - "firewall-offline-cmd --zone=public --add-service=ssh"
  # --- appstream cache ---
  # Kickoff's application grid reads the AppStream metadata cache; KRunner's
  # search bypasses it and scans .desktop files directly -- that mismatch is
  # why search finds apps but the grid can appear empty. Refresh once now so
  # the first boot already has a warm cache, and keep it fresh on future
  # package changes (e.g. via paru/toolbox) with a pacman hook.
  - "appstreamcli refresh-cache --force || true"
  - |
    install -Dm644 /dev/stdin /etc/pacman.d/hooks/97-appstream-refresh.hook <<EOF
    [Trigger]
    Type = Path
    Operation = Install
    Operation = Upgrade
    Operation = Remove
    Target = usr/share/metainfo/*
    Target = usr/share/appdata/*

    [Action]
    Description = Refreshing AppStream metadata cache...
    When = PostTransaction
    Exec = /usr/bin/appstreamcli refresh-cache --force
    EOF
