efiSystemPartition: "/boot"
efiSystemPartitionSize: 1024M
# "suspend": a real swap PARTITION sized for hibernation (>= RAM), not a
# btrfs swap file -- avoids btrfs's NODATACOW/resume_offset fragility and
# Calamares' own flaky btrfs-swapfile support. Paired with zram-generator
# (see iso/airootfs/etc/systemd/zram-generator.conf) for day-to-day
# overflow, so this partition sits idle except during hibernate/resume.
# `resume=UUID=...` for it is added to the kernel cmdline in
# shellprocess-postinstall.conf.
userSwapChoices:
  - suspend
  - none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
initialPartitionAttributes: []
btrfsSubvolumes:
  - { subvolume: "/",          mountPoint: "@" }
  - { subvolume: "/home",      mountPoint: "@home" }
  - { subvolume: "/var/log",   mountPoint: "@log" }
  - { subvolume: "/var/cache/pacman/pkg", mountPoint: "@pkg" }
  - { subvolume: "/.snapshots", mountPoint: "@snapshots" }
