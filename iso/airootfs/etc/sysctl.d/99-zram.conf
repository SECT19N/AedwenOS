# Default vm.swappiness=60 assumes swap means a slow disk, so the kernel is
# reluctant to use it. zram swap (see /etc/systemd/zram-generator.conf) is
# RAM-backed and compressed -- cheap to use -- so raise swappiness to make
# the kernel actually take advantage of it. 150 matches Fedora's own
# zram-default tuning; the zram project's general recommendation is 150-200.
vm.swappiness = 150
