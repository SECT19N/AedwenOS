# Default vm.swappiness=60 assumes swap means a slow disk, so the kernel is
# reluctant to use it. zram swap (see /etc/systemd/zram-generator.conf) is
# RAM-backed and compressed -- cheap to use -- so raise it. 100 is a middle
# value: high enough to use zram early, low enough that the kernel does not
# push pages towards the slow disk swap too eagerly (the zram project
# suggests 100-200; Fedora uses 150).
# To change it, don't edit this file: add your own, e.g.
#   echo 'vm.swappiness = 60' | sudo tee /etc/sysctl.d/99-local.conf
# (loads after this one), or try a value live with `sudo sysctl vm.swappiness=60`.
vm.swappiness = 100
