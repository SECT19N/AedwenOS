# kms: loads the real GPU's DRM/KMS driver before plymouth starts, so the
# splash (and console) render at native resolution instead of a low-res
# efifb/vesafb fallback that only gets replaced after the initramfs hands off
# (fine under QEMU's virtual GPU, visibly glitchy on real hardware).
# plymouth: branded boot splash on the live medium (must sit right after kms,
# before archiso). Needs "splash" on the kernel cmdline -- see syslinux.cfg and
# efiboot/loader/entries/aedwen.conf.
# keymap/consolefont: apply the shipped vconsole.conf (KEYMAP=us) during early
# boot instead of only after the full system is up.
HOOKS=(base udev kms plymouth modconf archiso keyboard keymap consolefont block filesystems)
COMPRESSION="zstd"
