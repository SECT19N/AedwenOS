#
# /etc/pacman.conf for the AedwenOS live medium AND the installed system.
#
# Model A: archiso copies this into the live root; Calamares clones the live
# root to disk (unpackfs), so the installed system inherits this file verbatim.
# The command-line installer (aedwen-install) uses pacstrap and then drops a
# copy of this file into the target.
#
# NOTE: this is NOT the pacman.conf used to *build* the ISO -- that one is
# iso/pacman.conf and is referenced by iso/profiledef.sh (pacman_conf=).

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
ILoveCandy

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# chaotic-aur: prebuilt AUR packages. `paru` is installed from here.
# Requires chaotic-keyring + chaotic-mirrorlist (both in iso/packages.x86_64);
# the chaotic signing key is trusted at ISO build time via the keyring package.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
