# AedwenOS boot menu look -- generated by scripts/generate-limine-wallpaper.py;
# do not edit by hand (the Appearance settings rewrite it for a new accent).
# Boot entries are appended after this by the installer / build.sh.
timeout: 3
wallpaper: boot():/limine-wallpaper.png
wallpaper_style: stretched
backdrop: 0b0c0f
interface_resolution: 1920x1080
interface_branding:
interface_help_hidden: yes
interface_help_colour: a8a2b4
interface_help_colour_bright: cdacff
term_foreground: cdacff
term_foreground_bright: e6e1ee
term_background: ff000000
term_background_bright: 16141d
term_palette: 16141d;ff9b93;a6d6a0;e7c27a;cdacff;cdacff;a8a2b4;e6e1ee
term_margin: 96
term_margin_gradient: 0
term_font_scale: 2x2
