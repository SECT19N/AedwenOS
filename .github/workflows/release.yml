# Build the AedwenOS ISO in a clean Arch container; optionally publish it.
#
# Manual only: Actions tab -> "Build ISO" -> Run workflow.
#   publish = false  build only; the ISO + .sha256 are kept as a workflow
#                    artifact for 3 days (use this to test the pipeline)
#   publish = true   also upload to the Internet Archive (item
#                    <IA_ITEM_PREFIX>-<version>) and create GitHub release
#                    <version> (tag created at the commit that was built)
#
# Setup (once): repo secrets IA_ACCESS_KEY and IA_SECRET_KEY (from
# https://archive.org/account/s3.php); optional repo variable IA_ITEM_PREFIX
# (default "aedwenos"; archive.org item names are global, so it must be
# unique to you).
name: Build ISO

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to the Internet Archive and create a GitHub release
        type: boolean
        default: false
      version:
        description: Release tag, e.g. v0.1.0 (required when publishing)
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PUBLISH: ${{ inputs.publish }}
      VERSION_INPUT: ${{ inputs.version }}
      IA_ITEM_PREFIX: ${{ vars.IA_ITEM_PREFIX || 'aedwenos' }}
    steps:
      - name: Check inputs
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          # Accept "0.1.0" as well as "v0.1.0"; the tag is always v-prefixed.
          VERSION="${VERSION_INPUT// /}"
          [[ -n "$VERSION" && "$VERSION" != v* ]] && VERSION="v$VERSION"
          [[ "$VERSION" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || { echo "::error::set version (e.g. 0.1.0) to publish"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [ -n "$IA_ACCESS_KEY" ] && [ -n "$IA_SECRET_KEY" ] || { echo "::error::set repo secrets IA_ACCESS_KEY and IA_SECRET_KEY"; exit 1; }
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists"; exit 1
          fi
          item="$IA_ITEM_PREFIX-$VERSION"
          # Item already taken (by you or anyone else)? Fail now, not after a 2h build.
          if [ "$(curl -fsS "https://archive.org/metadata/$item")" != "{}" ]; then
            echo "::error::archive.org item '$item' already exists -- pick another version or IA_ITEM_PREFIX"; exit 1
          fi
          echo "IA_ITEM=$item" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h / /mnt || df -h /

      - name: Pick build dir
        run: |
          # /mnt is the runner's ext4 scratch disk, when it has more room than /.
          avail() { df --output=avail -B1G "$1" 2>/dev/null | tail -n1 | tr -d ' ' || echo 0; }
          if [ "$(avail /mnt)" -gt "$(avail /)" ]; then d=/mnt/aedwen; else d=$HOME/aedwen-build; fi
          sudo mkdir -p "$d"
          echo "BUILD_DIR=$d" >> "$GITHUB_ENV"

      - name: Build ISO (Arch container)
        run: |
          docker run --rm --privileged \
            -e HOST_UID="$(id -u)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$BUILD_DIR:/build" \
            archlinux:latest bash /src/scripts/ci-build.sh

      - name: Locate outputs
        run: |
          iso=$(ls "$BUILD_DIR"/out/*.iso)
          echo "ISO=$iso" >> "$GITHUB_ENV"
          echo "ISO_NAME=$(basename "$iso")" >> "$GITHUB_ENV"
          ls -lh "$BUILD_DIR"/out
          cat "$iso.sha256"

      - name: Keep as workflow artifact (build only)
        if: inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: aedwenos-iso
          path: |
            ${{ env.ISO }}
            ${{ env.ISO }}.sha256
          retention-days: 3
          compression-level: 0

      - name: Upload to the Internet Archive
        if: inputs.publish == true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          pipx install internetarchive
          install -m700 -d ~/.config/internetarchive
          printf '[s3]\naccess = %s\nsecret = %s\n' "$IA_ACCESS_KEY" "$IA_SECRET_KEY" \
            > ~/.config/internetarchive/ia.ini
          chmod 600 ~/.config/internetarchive/ia.ini

          ia upload "$IA_ITEM" "$ISO" "$ISO.sha256" \
            --retries 20 --no-derive --verify \
            --metadata="mediatype:software" \
            --metadata="collection:opensource_media" \
            --metadata="title:AedwenOS $VERSION" \
            --metadata="creator:AedwenOS" \
            --metadata="subject:linux;arch linux;operating system;iso" \
            --metadata="description:AedwenOS $VERSION live/install ISO (x86_64, UEFI). Source: https://github.com/$GITHUB_REPOSITORY" \
            --metadata="source:https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"

      - name: Create GitHub release
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://archive.org/download/$IA_ITEM/$ISO_NAME"
          sum=$(cat "$ISO.sha256")
          {
            echo "## Download"
            echo
            echo "- [$ISO_NAME]($url) (Internet Archive; too large for GitHub's 2 GiB limit)"
            echo "- [Torrent](https://archive.org/download/$IA_ITEM/${IA_ITEM}_archive.torrent) (usually faster)"
            echo
            echo "New uploads can take a while to appear while the Internet Archive processes them."
            echo
            echo "## Verify"
            echo
            echo '```'
            echo "$sum"
            echo '```'
            echo
            echo "Put the .sha256 next to the ISO and run \`sha256sum -c $ISO_NAME.sha256\`."
          } > notes.md
          gh release create "$VERSION" "$ISO.sha256" \
            --target "$GITHUB_SHA" \
            --title "AedwenOS $VERSION" \
            --notes-file notes.md
